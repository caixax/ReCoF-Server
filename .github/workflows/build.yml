name: Build

# ReCoF Server: the engine, the dedicated launcher and the filesystem for Windows and Linux.
# Upstream ReHLDS's workflow signs with its own keys and replays its test demos; this one only builds.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild msvc/ReHLDS.sln /m "/t:ReHLDS;dedicated;filesystem_stdio" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:XPDeprecationWarning=false

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item msvc/Release/hlds.exe, msvc/Release/swds.dll, msvc/Release/filesystem_stdio.dll, rehlds/lib/steam_api.dll publish/
          Copy-Item msvc/Release/hlds.pdb, msvc/Release/swds.pdb, msvc/Release/filesystem_stdio.pdb publish/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: recof-server-windows
          path: publish/

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    # Debian 11 (glibc 2.31), so the result runs on Debian 11, Ubuntu 20.04 and newer
    container: debian:11-slim
    steps:
      - name: Install dependencies
        run: |
          # Debian 11 left LTS on 2026-08-31: the base suite comes from the Debian archive, as upstream does
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          EOF
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates gcc-multilib g++-multilib build-essential libc6-dev libc6-dev-i386 git cmake

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build -j"$(nproc)" --target engine hlds filesystem_stdio

      - name: Collect
        run: |
          mkdir -p publish
          cp build/rehlds/engine_i486.so build/rehlds/dedicated/hlds_linux build/rehlds/filesystem/FileSystem_Stdio/filesystem_stdio.so publish/
          ldd publish/engine_i486.so || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: recof-server-linux
          path: publish/
